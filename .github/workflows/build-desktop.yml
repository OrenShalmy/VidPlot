name: Build desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Upload build zips to a GitHub Release'
        type: boolean
        default: false
      version:
        description: 'Release tag when creating a release (e.g. v1.0.1)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: VidPlot-macOS-arm64
            kind: mac
          - os: windows-latest
            artifact: VidPlot-Windows-x64
            kind: win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Windows extras
        if: matrix.kind == 'win'
        run: pip install pywin32 pythonnet

      - name: Build desktop app
        run: python build_desktop.py

      - name: Package macOS .app
        if: matrix.kind == 'mac'
        run: |
          test -d dist/VidPlot.app
          ditto -c -k --keepParent dist/VidPlot.app "dist/${{ matrix.artifact }}.zip"
          ls -lh "dist/${{ matrix.artifact }}.zip"

      - name: Package Windows folder
        if: matrix.kind == 'win'
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\VidPlot\VidPlot.exe')) { throw 'VidPlot.exe missing' }
          Compress-Archive -Path 'dist\VidPlot' -DestinationPath "dist\${{ matrix.artifact }}.zip" -Force
          Get-Item "dist\${{ matrix.artifact }}.zip" | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.create_release &&
       inputs.version != '')
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: VidPlot-*
          merge-multiple: true

      - name: List assets
        run: ls -lah artifacts

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: VidPlot ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            artifacts/VidPlot-macOS-arm64.zip
            artifacts/VidPlot-Windows-x64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
