name: Build desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Upload build zips to a GitHub Release'
        type: boolean
        default: false
      version:
        description: 'Release tag when creating a release (e.g. v1.0.1)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: VidPlot-MacOS-arm64
            kind: mac
            builder_args: --mac --arm64
          - os: windows-latest
            artifact: VidPlot-Windows-x64
            kind: win
            builder_args: --win --x64
          - os: windows-11-arm
            artifact: VidPlot-Windows-arm64
            kind: win
            builder_args: --win --arm64
          - os: ubuntu-latest
            artifact: VidPlot-Linux-x64
            kind: linux
            builder_args: --linux --x64
          - os: ubuntu-24.04-arm
            artifact: VidPlot-Linux-arm64
            kind: linux
            builder_args: --linux --arm64

    runs-on: ${{ matrix.os }}

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Linux packaging deps
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 \
            xdg-utils libatspi2.0-0 libuuid1 libsecret-1-0 \
            fuse libfuse2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build analysis sidecar
        run: python build_desktop.py

      - name: Make Linux sidecar executable
        if: matrix.kind == 'linux'
        run: chmod +x dist/vidplot-server/VidPlotServer

      - name: Verify sidecar output
        run: |
          python -c "import glob; print('Sidecar candidates:', glob.glob('dist/**/VidPlotServer*', recursive=True)[:20])"

      - name: Install npm dependencies
        run: npm ci

      - name: Verify Electron binary
        env:
          # GitHub Ubuntu runners do not set up chrome-sandbox SUID; electron --version
          # still starts the binary and would abort without this.
          ELECTRON_DISABLE_SANDBOX: '1'
        run: npx electron --version

      - name: Package Electron app
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: npx electron-builder --publish never ${{ matrix.builder_args }}

      - name: List packaged output
        run: |
          node -e "const fs=require('fs'); const p='dist-electron'; if(!fs.existsSync(p)){console.error('Missing '+p); process.exit(1);} const walk=(d)=>fs.readdirSync(d).flatMap(n=>{const x=require('path').join(d,n); const s=fs.statSync(x); return s.isDirectory()?walk(x):[x];}); console.log(walk(p).join('\n'));"

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged
          # Portable zip (all platforms)
          zip="dist-electron/${{ matrix.artifact }}.zip"
          test -f "$zip"
          cp "$zip" staged/
          # Windows NSIS installer (file associations)
          if [[ "${{ matrix.kind }}" == "win" ]]; then
            setup="dist-electron/${{ matrix.artifact }}-Setup.exe"
            test -f "$setup"
            cp "$setup" staged/
          fi
          # Linux AppImage (MIME / Open with)
          # electron-builder uses arch token x86_64 (not x64) in AppImage filenames
          if [[ "${{ matrix.kind }}" == "linux" ]]; then
            canonical="dist-electron/${{ matrix.artifact }}.AppImage"
            if [[ -f "$canonical" ]]; then
              cp "$canonical" staged/
            else
              shopt -s nullglob
              found=(dist-electron/VidPlot-Linux-*.AppImage)
              shopt -u nullglob
              if [[ ${#found[@]} -lt 1 ]]; then
                echo "No AppImage found under dist-electron/" >&2
                ls -lah dist-electron || true
                exit 1
              fi
              echo "Using AppImage: ${found[0]} -> staged/${{ matrix.artifact }}.AppImage"
              cp "${found[0]}" "staged/${{ matrix.artifact }}.AppImage"
            fi
          fi
          ls -lah staged

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: staged/*
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.create_release &&
       inputs.version != '')
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: VidPlot-*
          merge-multiple: true

      - name: List assets
        run: ls -lah artifacts

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: VidPlot ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          body: |
            ## Downloads

            - **MacOS:** `VidPlot-MacOS-arm64.zip` ("Open with" works after first launch)
            - **Windows:** prefer `VidPlot-Windows-*-Setup.exe` for file associations; zip is portable
            - **Linux:** prefer `VidPlot-Linux-*.AppImage` for MIME / "Open with"; zip is portable.
              AppImage needs `zlib1g` (and usually `libfuse2` / `libfuse2t64`). Zip builds
              run with Chromium `--no-sandbox` (no root chrome-sandbox required).
              Fallback: `APPIMAGE_EXTRACT_AND_RUN=1 ./VidPlot-Linux-*.AppImage` or
              `./vidplot --no-sandbox` from the unzipped folder.

            ## MacOS first launch

            Release builds are not notarized. If MacOS says **"VidPlot.app is damaged"**, the download is quarantined — not corrupt.

            1. Control-click `VidPlot.app` → **Open** → **Open** again.
            2. If still blocked: **System Settings → Privacy & Security** → **Open Anyway**.

            Terminal fallback: `cp -R -X ~/Downloads/VidPlot.app /Applications/VidPlot.app`

            FFmpeg must be installed separately (`brew install ffmpeg` on MacOS;
            `apt install ffmpeg` on Debian/Ubuntu).

            ## Open with VidPlot

            After install, use **Open with → VidPlot** (or set as default in OS settings) for common video types.
          files: |
            artifacts/VidPlot-MacOS-arm64.zip
            artifacts/VidPlot-Windows-x64.zip
            artifacts/VidPlot-Windows-x64-Setup.exe
            artifacts/VidPlot-Windows-arm64.zip
            artifacts/VidPlot-Windows-arm64-Setup.exe
            artifacts/VidPlot-Linux-x64.zip
            artifacts/VidPlot-Linux-x64.AppImage
            artifacts/VidPlot-Linux-arm64.zip
            artifacts/VidPlot-Linux-arm64.AppImage
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
