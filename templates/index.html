<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e1e1e">
  <title>VidPlot - Video Frame Analysis</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192x192.png') }}">
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <script src="{{ url_for('static', filename='js/upload.js') }}"></script>
  <script src="{{ url_for('static', filename='js/plotly.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/js/sw.js')
          .then(registration => {
            console.log('ServiceWorker registration successful');
          })
          .catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
      });
    }
  </script>
</head>
<body>

<!-- Drag and Drop Uploader -->
<div id="dropArea">
    <p>Drag & Drop a video file or click to select</p>
    <input type="file" id="videoUpload" name="video" accept="video/*" hidden>
</div>

<!-- Video Player Section -->
<div id="videoSection">
  <video id="videoPlayer" controls>
    <source id="videoSource" src="" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <button id="toggleInfoBtn" title="Show/Hide Info">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="8"/></svg>
  </button>
  <div id="mediaInfo" class="media-info-overlay">
    <!-- Filled by mediainfo.js -->
  </div>
</div>

<!-- Frame Graph Section -->
<div id="frameGraphSection">
  <div id="frameChart"></div>
</div>

<div class="toggles"></div>
<script src="{{ url_for('static', filename='js/mediainfo.js') }}"></script>
</body>
</html>
