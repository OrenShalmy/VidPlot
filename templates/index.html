<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e1e1e">
  <title>VidPlot - Video Frame Analysis</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192x192.png') }}">
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <script src="{{ url_for('static', filename='js/upload.js') }}"></script>
  <script src="{{ url_for('static', filename='js/plotly.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/js/sw.js')
          .then(registration => {
            console.log('ServiceWorker registration successful');
          })
          .catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
      });
    }
  </script>
</head>
<body>

<!-- Drag and Drop Uploader -->
<div id="dropArea">
    <p>Drag & Drop a video file or click to select</p>
    <input type="file" id="videoUpload" name="video" accept="video/*" hidden>
</div>

<!-- Video Player -->
<div id="videoContainer">
  <video id="videoPlayer" controls hidden>
    <source id="videoSource" src="" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <div id="mediaInfo"></div>
</div>
  <script src="{{ url_for('static', filename='js/mediainfo.js') }}"></script>

  <!-- Plotly Chart Container -->
  <div id="frameChart"></div>
  
  <!-- frame type checkboxes -->
  <div class="toggles">  
    <label><input type="checkbox" id="iFrameToggle" checked> I-Frames</label>
    <label><input type="checkbox" id="pFrameToggle" checked> P-Frames</label>
    <label><input type="checkbox" id="bFrameToggle" checked> B-Frames</label>
  </div>
</body>
</html>
