<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Interactive Frame Data Plot (Plotly)</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <script src="{{ url_for('static', filename='js/upload.js') }}"></script>
  <script src="{{ url_for('static', filename='js/plotly.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>

  <!-- Video Upload Form -->
  <form id="uploadForm" action="/upload" method="post" enctype="multipart/form-data">
    <label for="videoUpload">Upload a video: </label>
    <input type="file" id="videoUpload" name="video" accept="video/*">
    <button type="submit">Upload</button>
  </form>

<!-- Drag and Drop Uploader -->
<div id="dropArea">
    <p>Drag & Drop a video file here or click to select</p>
    <input type="file" id="videoUpload" name="video" accept="video/*" hidden>
</div>

<!-- Video Player (Initially Hidden) -->
<video id="videoPlayer" controls hidden>
    <source id="videoSource" src="" type="video/mp4">
    Your browser does not support the video tag.
</video>
  
  <!-- Plotly Chart Container -->
  <div id="frameChart"></div>
  
  <!-- frame type checkboxes -->
  <div class="toggles">  
    <label><input type="checkbox" id="iFrameToggle" checked> I-Frames</label>
    <label><input type="checkbox" id="pFrameToggle" checked> P-Frames</label>
    <label><input type="checkbox" id="bFrameToggle" checked> B-Frames</label>
  </div>

  <!-- Data Table -->
  <table>
    <thead>
      <tr>
        <th>Timestamp</th>
        <th>Packet Size</th>
        <th>Picture Type</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>
</body>
</html>
